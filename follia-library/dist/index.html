    <meta

      content="Follia Library — discover, save, and share books, stories, comics, and digital resources."
    />

    <title>Follia Library</title>

    <script>
      try {
        const savedTheme = localStorage.getItem('follia-theme') || 'light'
        const systemPrefersDark =
          window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false

        const activeTheme = savedTheme === 'dark' || (savedTheme !== 'light' && systemPrefersDark)

        document.documentElement.setAttribute('data-theme', activeTheme ? 'dark' : 'light')
      } catch {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
