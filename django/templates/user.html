<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="See how many readers are part of the Follia Library community.">
  <title>Follia Library Users</title>
  <style>
    :root { color-scheme: light; --ink: #20231f; --muted: #70756c; --paper: #f7f5ef; --card: #fffefa; --accent: #315d45; --line: #e6e4dc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 15% 5%, #e7eddf 0, transparent 38%), var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 720px); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; font-size: 14px; font-weight: 750; letter-spacing: -.02em; }
    .mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px; background: var(--accent); color: white; font-family: Georgia, serif; font-size: 24px; }
    .panel { padding: clamp(28px, 7vw, 64px) clamp(20px, 6vw, 56px); border: 1px solid var(--line); border-radius: 28px; background: color-mix(in srgb, var(--card) 94%, transparent); box-shadow: 0 24px 70px rgb(31 39 29 / 7%); text-align: center; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(30px, 6vw, 48px); font-weight: 600; letter-spacing: -.045em; line-height: 1.08; }
    .description { max-width: 410px; margin: 16px auto 30px; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .count { display: block; color: var(--accent); font-size: clamp(56px, 13vw, 100px); font-weight: 800; letter-spacing: -.075em; line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .count-label { margin: 12px 0 0; color: var(--muted); font-size: 13px; font-weight: 650; }
    .footer { margin: 22px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 420px) { body { padding: 14px; } .panel { border-radius: 20px; } .description { font-size: 14px; } }
    @media (prefers-reduced-motion: no-preference) { .panel { animation: arrive .45s ease-out both; } @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">f</span><span>Follia Library</span></div>
    <section class="panel" aria-labelledby="page-title">
      <p class="eyebrow">Our community</p>
      <h1 id="page-title">Follia Library users</h1>
      <p class="description">A growing community of readers, learners, and people sharing what they love.</p>
      <output class="count" aria-label="Total registered users">{{ user_count }}</output>
      <p class="count-label">registered {% if user_count == 1 %}user{% else %}users{% endif %}</p>
    </section>
    <p class="footer">Every reader helps the library grow.</p>
  </main>
</body>
</html>
